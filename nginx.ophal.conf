## Ophal requires a shared memory zone for projection cache versions.
## `lua_shared_dict` is an http-level directive, so it cannot live in this
## server block -- add the following line to the enclosing `http { }` block:
##
##   lua_shared_dict ophal_projection_versions 1m;
##
## Without it every worker keeps a private, never-invalidated copy of the
## projection versions and stale public pages are served after a write. The
## zone name can be overridden with `settings.performance.projection_shared_dict`.

server {
  listen 80;
  server_name example.com;

  root /path/to/document/root/;

  ## The cron endpoint drains the deferred work queue, whose jobs are unbounded
  ## in the size of the tables they rebuild, so it is not a public location.
  ## Restrict it to the hosts that schedule it, and set `settings.cron.token`
  ## (from `vault.cron.token`) so the endpoint is also guarded when Ophal is
  ## reached through a proxy, from another host, or by a caller that gets past
  ## this block. Ophal warns and allows when no token is configured, which is
  ## what keeps an upgrade from silently stopping a site's scheduled work; these
  ## two lines are what protects that default.
  location = /cron {
    allow 127.0.0.1;
    deny all;

    lua_code_cache on;
    default_type text/html;
    set $ophal_script_name /cron.lua;

    set_by_lua $_ '
      require "lfs".chdir(ngx.var.document_root)
      return nil
    ';

    content_by_lua_file $document_root/cron.lua;
  }

  location = /__ophal_index__ {
    internal;
    lua_code_cache on;
    default_type text/html;
    set $ophal_script_name /index.lua;

    set_by_lua $_ '
      require "lfs".chdir(ngx.var.document_root)
      return nil
    ';

    content_by_lua_file $document_root/index.lua;
  }

  location = /index.lua { return 404; }
  location = /cron.lua { return 404; }
  location = /settings.lua { return 404; }
  location = /vault.lua { return 404; }
  location ^~ /settings/ { return 404; }
  location ^~ /includes/ { return 404; }
  location ^~ /modules/ { return 404; }

  location ~ \.lua$ {
    return 404;
  }

  ## All static files will be served directly.
  location ~* ^.+\.(?:css|cur|js|jpg|jpeg|gif|htc|ico|png|html|xml|less|ttf|pdf|map)$ {
    try_files $uri =404;
    access_log off;
    expires 30d;
    ## No need to bleed constant updates. Send the all shebang in one
    ## fell swoop.
    tcp_nodelay off;
    ## Set the OS file cache.
    open_file_cache max=3000 inactive=120s;
    open_file_cache_valid 45s;
    open_file_cache_min_uses 2;
    open_file_cache_errors off;
  }

  location / {
    ## `$is_args$args` is not decoration. A bare `try_files $uri /__ophal_index__`
    ## discards the query string on the internal redirect -- `$request_uri` still
    ## carries it, but `$args` is empty, so `ngx.req.get_uri_args()` and every
    ## `_GET` derived from it come back empty for every request that reaches the
    ## application this way. That is all of them except the `location =` blocks
    ## below. `$is_args` contributes the `?` only when there is a query to carry.
    try_files $uri /__ophal_index__$is_args$args;
  }

  access_log /var/log/nginx/example.com-access.log;
  error_log /var/log/nginx/example.com-error.log;
}
